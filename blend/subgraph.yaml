specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ERC1967Proxy
    network: mainnet
    source:
      address: "0x29469395eaf6f95920e59f858042f0e28d98a20b"
      abi: ERC1967Proxy
      startBlock: 17163167
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AdminChanged
        - BeaconUpgraded
        - Upgraded
      abis:
        - name: ERC1967Proxy
          file: ./abis/ERC1967Proxy.json
      eventHandlers:
        - event: AdminChanged(address,address)
          handler: handleAdminChanged
        - event: BeaconUpgraded(indexed address)
          handler: handleBeaconUpgraded
        - event: Upgraded(indexed address)
          handler: handleUpgraded
      file: ./src/erc-1967-proxy.ts
  - kind: ethereum
    name: Blend
    network: mainnet
    source:
      address: "0x29469395eaf6f95920e59f858042f0e28d98a20b"
      abi: Blend
      startBlock: 17163167
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Lien
        - Account
        - LienEvent
      abis:
        - name: Blend
          file: ./abis/Blend.json
      eventHandlers:
        - event: LoanOfferTaken(bytes32,uint256,address,address,address,uint256,uint256,uint256,uint256)
          handler: handleLoanOfferTaken
        - event: Repay(uint256,address)
          handler: handleRepay
        - event: Refinance(uint256,address,address,uint256,uint256,uint256)
          handler: handleRefinance
        - event: StartAuction(uint256,address)
          handler: handleStartAuction
        - event: Seize(uint256,address)
          handler: handleSeize
        - event: BuyLocked(uint256,address,address,address,uint256)
          handler: handleBuyLocked
      file: ./src/blend.ts
